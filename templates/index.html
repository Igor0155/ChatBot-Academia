<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Interativo</title>
    <link rel="stylesheet" href="../static/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1 style="color: rgb(255, 179, 0)">Chatbot Fitness</h1>
        <p>Seu assistente de treino e motivação na palma da mão.</p>
      </header>

      <main class="chat-container" id="chatContainer" aria-live="polite"></main>

      <form id="chatForm" class="chat-form" autocomplete="off">
        <input
          id="messageInput"
          type="text"
          placeholder="Digite sua mensagem..."
          aria-label="Mensagem do usuário"
          required
        />
        <button type="submit">Enviar</button>
      </form>
    </div>

    <script src="../static/js/app.js"></script>
  </body>
</html>
